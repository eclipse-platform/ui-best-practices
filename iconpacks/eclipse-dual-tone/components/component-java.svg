       position="8,1"
       orientation="0,1"
       inkscape:locked="true" /></sodipodi0:namedview><!-- Locked reference layer: live-area outline + default-style sample. Hide or delete before export. --><!-- Draw your icon here. New shapes inherit this 1 px round-stroke default style. --><g
