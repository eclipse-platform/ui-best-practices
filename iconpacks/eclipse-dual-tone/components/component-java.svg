     inkscape:snap-grids="true"
     inkscape:snap-to-guides="true"
     inkscape:snap-page="true"
     inkscape:object-nodes="true"
     inkscape:snap-smooth-nodes="true"
     inkscape:snap-midpoints="true"
     inkscape:zoom="32"
     inkscape:cx="8"
     inkscape:cy="8"><!-- 0.5 px grid: lands stroke centerlines on x.5 for crisp 1 px strokes --><inkscape:grid
       id="grid-half-px"
       type="xygrid"
       units="px"
       spacingx="0.5"
       spacingy="0.5"
       empspacing="2"
       color="#3f3fff"
       opacity="0.12"
       empcolor="#3f3fff"
       empopacity="0.24" /><!-- 14x14 live area: 1 px margin on every side --><sodipodi0:guide
       id="guide-left"
       position="1,8"
       orientation="1,0"
       inkscape:locked="true"
       inkscape:label="live area" /><sodipodi0:guide
       id="guide-right"
       position="15,8"
       orientation="1,0"
