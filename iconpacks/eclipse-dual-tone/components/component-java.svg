     inkscape:window-width="1728"
     inkscape:window-height="999"
     inkscape:window-x="0"
     inkscape:window-y="33"
     inkscape:window-maximized="1"
     inkscape:current-layer="layer-icon"
     showgrid="true"><inkscape:grid
       id="grid1"
       units="px"
       originx="0"
       originy="0"
       spacingx="1"
       spacingy="1"
       empcolor="#0099e5"
       empopacity="0.30196078"
       color="#0099e5"
       opacity="0.14901961"
       empspacing="5"
       enabled="true"
       visible="true" /></sodipodi:namedview><defs
     id="defs-tones"><inkscape:path-effect
       effect="fillet_chamfer"
       id="path-effect2"
       is_visible="true"
       lpeversion="1"
       nodesatellites_param="F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1"
       radius="1"
       unit="px"
       method="auto"
       mode="F"
       chamfer_steps="1"
       flexible="false"
       use_knot_distance="true"
       apply_no_radius="true"
       apply_with_radius="true"
       only_selected="false"
       hide_knots="false" /><!-- Dual Tone palette (from STYLE_GUIDE.md) --><!-- Gray  #A8A8A8  default base icon color --><!-- Green #499C54  action        Red #C80000 error/stop --><!-- Yellow #FFD700 warning       Blue #0065C7 information --><!-- Orange #FF7F27 interaction --><inkscape:swatch
       id="tone-gray"
       style="fill:#a8a8a8;stroke:#a8a8a8"
       inkscape:label="Gray (default)" /><inkscape:swatch
       id="tone-green"
       style="fill:#499c54;stroke:#499c54"
       inkscape:label="Green (action)" /><inkscape:swatch
       id="tone-red"
       style="fill:#c80000;stroke:#c80000"
       inkscape:label="Red (error)" /><inkscape:swatch
       id="tone-yellow"
       style="fill:#ffd700;stroke:#ffd700"
       inkscape:label="Yellow (warning)" /><inkscape:swatch
       id="tone-blue"
