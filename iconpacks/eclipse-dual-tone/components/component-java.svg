       id="tone-orange"
       style="fill:#ff7f27;stroke:#ff7f27"
       inkscape:label="Orange (interaction)" /><inkscape:path-effect
       effect="fillet_chamfer"
       id="path-effect2-2"
       is_visible="true"
       lpeversion="1"
