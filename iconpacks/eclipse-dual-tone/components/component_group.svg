<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Eclipse Dual Tone icon template
  - Canvas: 16x16 px
  - Live area: 14x14 px, 1 px margin (guides at 1 and 15)
  - Grid: 0.5 px (snap 1 px stroke centerlines to x.5)
  - Default stroke: 1 px, round join/cap, no fill
  - Tone swatches in <defs> (Gray #A8A8A8 default + accents)
  Draw inside the guides, then Path > Stroke to Path before export.
-->

<svg
   width="16"
   height="16"
   viewBox="0 0 16 16"
   version="1.1"
   id="svg-dual-tone-template"
   sodipodi:docname="component_group.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:sodipodi0="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="false"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="26.972692"
     inkscape:cx="7.6558914"
     inkscape:cy="8.4159193"
     inkscape:window-width="1728"
     inkscape:window-height="999"
     inkscape:window-x="0"
     inkscape:window-y="33"
     inkscape:window-maximized="0"
     inkscape:current-layer="layer-icon"
     showgrid="true">
    <inkscape:grid
       id="grid1"
       units="px"
       originx="0"
       originy="0"
       spacingx="1"
       spacingy="1"
       empcolor="#0099e5"
       empopacity="0.30196078"
       color="#0099e5"
       opacity="0.14901961"
       empspacing="5"
       enabled="true"
       visible="true" />
  </sodipodi:namedview>
  <defs
     id="defs-tones">
    <inkscape:path-effect
       effect="fillet_chamfer"
       id="path-effect2"
       is_visible="true"
       lpeversion="1"
       nodesatellites_param="F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1"
       radius="1"
       unit="px"
       method="auto"
       mode="F"
       chamfer_steps="1"
       flexible="false"
       use_knot_distance="true"
       apply_no_radius="true"
       apply_with_radius="true"
       only_selected="false"
       hide_knots="false" />
    <!-- Dual Tone palette (from STYLE_GUIDE.md) -->
    <!-- Gray  #A8A8A8  default base icon color -->
    <!-- Green #499C54  action        Red #C80000 error/stop -->
    <!-- Yellow #FFD700 warning       Blue #0065C7 information -->
    <!-- Orange #FF7F27 interaction -->
    <inkscape:swatch
       id="tone-gray"
       style="fill:#a8a8a8;stroke:#a8a8a8"
       inkscape:label="Gray (default)" />
    <inkscape:swatch
       id="tone-green"
       style="fill:#499c54;stroke:#499c54"
       inkscape:label="Green (action)" />
    <inkscape:swatch
       id="tone-red"
       style="fill:#c80000;stroke:#c80000"
       inkscape:label="Red (error)" />
    <inkscape:swatch
       id="tone-yellow"
       style="fill:#ffd700;stroke:#ffd700"
       inkscape:label="Yellow (warning)" />
    <inkscape:swatch
       id="tone-blue"
       style="fill:#0065c7;stroke:#0065c7"
       inkscape:label="Blue (information)" />
    <inkscape:swatch
       id="tone-orange"
       style="fill:#ff7f27;stroke:#ff7f27"
       inkscape:label="Orange (interaction)" />
    <inkscape:path-effect
       effect="fillet_chamfer"
       id="path-effect2-2"
       is_visible="true"
       lpeversion="1"
       nodesatellites_param="F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1"
       radius="1"
       unit="px"
       method="auto"
       mode="F"
       chamfer_steps="1"
       flexible="false"
       use_knot_distance="true"
       apply_no_radius="true"
       apply_with_radius="true"
       only_selected="false"
       hide_knots="false" />
    <inkscape:path-effect
       effect="fillet_chamfer"
       id="path-effect2-2-2"
       is_visible="true"
       lpeversion="1"
       nodesatellites_param="F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1 @ F,0,0,1,0,1,0,1"
       radius="1"
       unit="px"
       method="auto"
       mode="F"
       chamfer_steps="1"
       flexible="false"
       use_knot_distance="true"
       apply_no_radius="true"
       apply_with_radius="true"
       only_selected="false"
       hide_knots="false" />
  </defs>
  <sodipodi0:namedview
     id="namedview-template"
     pagecolor="#ffffff"
     bordercolor="#0c0005"
     inkscape:deskcolor="#ffffff"
     inkscape:document-units="px"
     inkscape:bbox-paths="true"
     inkscape:bbox-nodes="true"
     showgrid="true"
     inkscape:snap-grids="true"
     inkscape:snap-to-guides="true"
     inkscape:snap-page="true"
     inkscape:object-nodes="true"
     inkscape:snap-smooth-nodes="true"
     inkscape:snap-midpoints="true"
     inkscape:zoom="32"
     inkscape:cx="8"
     inkscape:cy="8">
    <!-- 0.5 px grid: lands stroke centerlines on x.5 for crisp 1 px strokes -->
    <inkscape:grid
       id="grid-half-px"
       type="xygrid"
       units="px"
       spacingx="0.5"
       spacingy="0.5"
       empspacing="2"
       color="#3f3fff"
       opacity="0.12"
       empcolor="#3f3fff"
       empopacity="0.24" />
    <!-- 14x14 live area: 1 px margin on every side -->
    <sodipodi0:guide
       id="guide-left"
       position="1,8"
       orientation="1,0"
       inkscape:locked="true"
       inkscape:label="live area" />
    <sodipodi0:guide
       id="guide-right"
       position="15,8"
       orientation="1,0"
       inkscape:locked="true" />
    <sodipodi0:guide
       id="guide-top"
       position="8,15"
       orientation="0,1"
       inkscape:locked="true" />
    <sodipodi0:guide
       id="guide-bottom"
       position="8,1"
       orientation="0,1"
       inkscape:locked="true" />
  </sodipodi0:namedview>
  <!-- Locked reference layer: live-area outline + default-style sample. Hide or delete before export. -->
  <!-- Draw your icon here. New shapes inherit this 1 px round-stroke default style. -->
  <g
     inkscape:groupmode="layer"
     id="layer-icon"
     inkscape:label="icon"
     style="fill:none;stroke:#a8a8a8;stroke-width:1;stroke-linecap:round;stroke-linejoin:round">
    <path
       id="path2"
       style="baseline-shift:baseline;display:inline;overflow:visible;vector-effect:none;fill:#7a7a7a;stroke:none;paint-order:stroke fill markers;enable-background:accumulate;stop-color:#000000;stop-opacity:1;opacity:1;fill-opacity:1"
       d="M 1.5 1 A 0.5 0.5 0 0 0 1 1.5 L 1 14.5 A 0.5 0.5 0 0 0 1.5 15 L 5.5 15 A 0.5 0.5 0 0 0 6 14.5 A 0.5 0.5 0 0 0 5.5 14 L 2 14 L 2 2 L 5.5 2 A 0.5 0.5 0 0 0 6 1.5 A 0.5 0.5 0 0 0 5.5 1 L 1.5 1 z " />
  </g>
</svg>
